[package]
name = "compositor"
version = "1.0.0"
edition = "2024"

[workspace]
members = ["."]

[dependencies.smithay]
git = "https://github.com/mufeedali/smithay"
branch = "perf-test"
default-features = false
features = [
  "backend_winit",
  "backend_drm",
  "backend_gbm",
  "backend_egl",
  "backend_udev",
  "backend_session_libseat",
  "backend_libinput",
  "renderer_gl",
  "desktop",
  "wayland_frontend",
]

[dependencies.smithay-drm-extras]
git = "https://github.com/mufeedali/smithay"
branch = "perf-test"
default-features = false

[dependencies]
thiserror = "2.0.20"
tracing = { version = "0.1", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3.11"
