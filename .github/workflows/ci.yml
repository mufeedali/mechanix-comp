  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1-mesa-dev \
            libwayland-dev \
            libdrm-dev \
            libgbm-dev \
            libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --locked


  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1-mesa-dev \
            libwayland-dev \
            libdrm-dev \
            libgbm-dev \
            libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked --no-fail-fast
